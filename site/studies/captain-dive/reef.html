<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#135d67" />
    <title>제주 감태숲 잠영 · 캡틴 다이브</title>
    <link rel="icon" href="../faceted-habitat/jeju-icon-192.png" />
    <link
      rel="apple-touch-icon"
      href="../faceted-habitat/jeju-apple-touch-icon.png"
    />
    <link rel="stylesheet" href="reef.css?v=shoal1" />
  </head>
  <body>
    <main id="reef">
      <canvas
        id="water"
        tabindex="0"
        aria-label="화면을 끌어 해안에서 바다로 이동하세요."
      ></canvas>
      <div class="waterlight" aria-hidden="true"></div>
      <header id="heading">
        <div class="place">
          <small id="mode-caption">캡틴 다이브 · 제주</small
          ><strong id="place">감태 해안</strong>
        </div>
        <button id="pause" hidden aria-label="탐사 일시정지">Ⅱ</button>
      </header>
      <div id="hud" hidden>
        <div class="gauges">
          <span>수심 <b id="depth">0.4 m</b></span
          ><span>동행 <b id="count">0종</b></span>
        </div>
        <div id="name-tags"></div>
        <div id="home-marker" class="tag home">귀환 부표</div>
        <div id="waymark" aria-hidden="true" hidden><i></i><i></i></div>
        <div id="track-meter" hidden aria-hidden="true"></div>
        <div id="reticle" hidden></div>
        <div id="stick" hidden><i></i></div>
        <div class="bottom-ui">
          <div id="note" role="status"></div>
          <span id="home-text" hidden></span>
        </div>
      </div>
      <section id="intro" class="sheet" aria-labelledby="title">
        <small>제주 감태숲</small>
        <h1 id="title">해안에서 감태숲으로</h1>
        <p id="instructions">
          바다 쪽으로 끌어 입수하세요. 물고기 앞을 톡 누르거나, 한 마리를 원
          안에 두고 함께 헤엄쳐요.
        </p>
        <div class="mode-actions">
          <button id="start" class="primary" disabled>물방울 쏘기</button>
          <button id="follow-start" disabled>원 안에서 따라가기</button>
          <button id="burst-start" hidden disabled>부채꼴 · 가속과 선회</button>
        </div>
        <a class="quiet" id="shoal-link" href="?study=shoal"
          >자리돔 추적 세 방식 비교</a
        >
        <p id="load-status" role="status" hidden></p>
      </section>
      <section id="rest" class="sheet" hidden>
        <h2>잠깐 쉬어요</h2>
        <p>계속하면 방금 있던 곳에서 이어져요.</p>
        <button id="resume" class="primary">계속 잠영</button>
        <a class="quiet" id="choose-mode" href="?study=shoal" hidden
          >비교 방식 다시 고르기</a
        >
      </section>
      <section id="result" class="sheet" hidden>
        <small id="result-mode">제주 감태숲 · 귀환</small>
        <h2 id="result-title"></h2>
        <p id="result-note"></p>
        <div class="sheet-actions">
          <a class="primary" id="open-book" href="journey.html?view=book"
            >도감에서 목표 고르기</a
          ><a id="open-tank" href="journey.html?view=tank">작은 수조</a>
        </div>
        <button id="swap" class="compare-next"></button>
        <button class="quiet" id="again">같은 방식 다시 하기</button>
      </section>
    </main>
    <script type="module" src="reef.mjs?v=shoal1"></script>
  </body>
</html>
