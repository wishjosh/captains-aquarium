<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>선장의 버블다발 · 3인칭 시안</title><link rel="stylesheet" href="study.css"></head><body><main id="game"><canvas id="sea" tabindex="-1"></canvas><div id="moveZone" aria-label="왼쪽 이동"></div><div id="lookZone" aria-label="오른쪽 시선 이동"></div><header><div class="title"><small>선장의 아쿠아리움 · 별도 시안</small><strong>잠영과 시점 비교</strong></div><nav><button id="mode">조향: 화면 기준</button><button id="auto">가까이 보기: 켬</button><button id="reset" aria-label="다시 시작">↻</button><button id="sound" aria-label="소리 끄기">♪</button><button id="pause" aria-label="잠시 쉬기">Ⅱ</button></nav></header><div id="status"><span id="step">01 · 가까이 다가가기</span><span id="count">등의 버블 0 / 3</span></div><div id="hint"></div><div id="target" aria-hidden="true">이쪽으로</div><div id="stickBase"><div id="stickKnob"></div></div><div class="moveLabel">이동</div><div id="depth"><button id="rise" aria-label="상승">↑</button><button id="sink" aria-label="하강">↓</button></div><button id="fire"><span>물방울</span><b>펼치기</b><small>누른 채 키우고 놓기</small></button><div id="demoLabel" hidden>동작을 보고 있어요 · 화면을 누르면 직접 조작</div><div id="curtain"><article><small>THIRD PERSON · MOVEMENT STUDY</small><h1>한 마리와<br>함께하는 탐사</h1><p>가까이 다가가 물방울로 감싸고,<br>등 뒤의 버블다발에 살며시 넘겨 주세요.</p><ol><li>왼쪽으로 잠영 · 오른쪽을 끌어 선장 주위를 보기</li><li>물방울을 누른 채 키우고, 물고기가 안에 오면 놓기</li><li>잡힌 물방울을 선장 쪽으로 쓸어 넘기기</li></ol><div class="buttons"><button id="start" disabled>바다를 준비하고 있어요…</button></div><small id="notice">기존 선장·흰동가리 사용 · 기록은 이 화면에만 남아요</small></article></div></main><script type="module" src="study.js"></script></body></html>
