<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b41">
<link rel="icon" href="./jeju-orca-192.png">
<title>제주 한 바퀴 · 선장의 아쿠아리움</title>
<style>
:root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#f7faee;background:#154751;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible,a:focus-visible{outline:3px solid #f8d797;outline-offset:3px}
button:disabled{opacity:.55;cursor:default}
#game{position:absolute;inset:0;overflow:hidden}
#sea{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none}
.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.location{padding:9px 13px;border-radius:14px;background:#102e36eb}
.location strong{display:block;font-size:1rem}
.location small{display:block;margin-top:3px;color:#b9d9cf}
.hud button{pointer-events:auto}
.return,.shoot,.target{min-height:44px;border-radius:13px;padding:0 13px;background:#153e46ed;color:#fff7df;font-weight:700}
.return{white-space:nowrap;border:1px solid #8dc1b3}
.target{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;border:1px solid #abdfc5;box-shadow:0 3px 12px #012c3880}
.target[aria-pressed=true]{background:#eff0bf;color:#173b3e;border-color:#f6d98d}
#game[data-aim="direct"] .target{pointer-events:none;transform:translate(-50%,calc(-100% - 18px));min-height:0;padding:4px 10px;font-size:.84rem;background:#11383dcc}
.modes{margin:0 0 15px;padding:0;border:0}
.modes legend{padding:0;margin:0 0 7px;font-size:.88rem;color:#daece0}
.mode-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.mode-option{position:relative;cursor:pointer}
.mode-option input{position:absolute;opacity:0;width:1px;height:1px}
.mode-option span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:7px;border:1px solid #78aba173;border-radius:12px;background:#285253;font-weight:700}
.mode-option input:checked+span{background:#e3ebcd;color:#173b3e;border-color:#e3ebcd}
.mode-option input:focus-visible+span{outline:3px solid #f8d797;outline-offset:2px}
.panel .mode-help{margin:7px 0 0;font-size:.83rem}
#status{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:min(90%,390px);bottom:calc(max(18px,env(safe-area-inset-bottom)) + 132px);margin:0;padding:8px 13px;background:#102e36eb;color:#f9f8e4;border-radius:14px;text-align:center;font-size:.9rem}
#stick{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:max(18px,env(safe-area-inset-left));width:114px;height:114px;border:2px solid #b6ddc8a0;border-radius:50%;background:#133b46c9;touch-action:none;user-select:none;pointer-events:auto}
#stick::before,#stick::after{position:absolute;left:50%;top:50%;color:#a8d2c3;font-size:.85rem;white-space:pre;line-height:85px;transform:translate(-50%,-50%);pointer-events:none}
#stick::before{content:"▲\A▼"}
#stick::after{content:"◀          ▶"}
#knob{position:absolute;left:50%;top:50%;width:38px;height:38px;border-radius:50%;background:#b3dace;translate:-50% -50%;box-shadow:0 2px 8px #0a293d}
.shoot{position:absolute;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 12px);right:max(18px,env(safe-area-inset-right));min-width:128px;min-height:58px;background:#f1d48b;color:#203938;box-shadow:0 5px 18px #062a3d88}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:#0a28345e}
.panel{width:min(100%,410px);max-height:100%;overflow:auto;padding:clamp(19px,5vw,33px);border-radius:25px;background:#14393cf5;border:1px solid #91beb373;box-shadow:0 10px 54px #072c368f}
.panel small{color:#b0d3b8;font-weight:700;letter-spacing:.035em}
h1,h2,h3,p{margin:0}
h1,h2{font-size:clamp(1.65rem,7vw,2.25rem);line-height:1.2;margin-top:6px;text-wrap:balance}
.panel p{word-break:keep-all;overflow-wrap:anywhere;font-size:.97rem;line-height:1.55;color:#e1eee0;margin:12px 0 17px}
.actions{display:flex;flex-wrap:wrap;gap:9px}
.primary,.secondary{border-radius:12px;min-height:48px;padding:9px 15px;font-weight:750}
.primary{background:#f2d48b;color:#263738}
.secondary{background:#285253;color:#fff7df}
.credit{display:inline-block;color:#bbd7c8;margin-top:13px;font-size:.8rem}
#cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:13px 0}
.card{min-width:0;text-align:left;padding:13px 10px;border-radius:12px;color:#173a3e;background:#f3e8c7;overflow-wrap:anywhere}
.card b{display:block;font-size:1rem}
.card span{display:block;margin-top:5px;font-size:.83rem}
.card:disabled{background:#dce4cf;opacity:.72}
.card img,#detail-image{display:block;width:100%;aspect-ratio:1.55;object-fit:cover;border-radius:8px;background:#438a87;margin-bottom:8px}
#detail-image{margin:11px 0 0}

@media(max-height:480px){.panel{padding:17px}.panel p{margin:8px 0 11px}#stick{width:88px;height:88px}#stick::before{line-height:65px}#stick::after{content:"◀       ▶"}#status{bottom:max(12px,env(safe-area-inset-bottom));max-width:46%}.card img{max-height:70px}#detail-image{max-height:96px;object-fit:contain}}
</style>
</head>
<body>
<main id="game">
  <canvas id="sea" aria-label="제주 감태숲 잠영 화면"></canvas>
  <section id="hud" class="hud" aria-label="잠영 조작" hidden>
    <div class="top">
      <div class="location"><strong id="place">감태숲 입구</strong><small id="companions">동행 0마리</small><small id="mode-label">이름으로 조준</small></div>
      <button id="return" class="return" type="button">배로 돌아가기</button>
    </div>
    <div id="targets"></div>
    <p id="status" role="status"></p>
    <div id="stick" aria-label="끌어서 헤엄치기"><span id="knob"></span></div>
    <button id="shoot" class="shoot" type="button" hidden>물방울 쏘기</button>
  </section>
  <section id="intro" class="overlay" aria-label="탐사 준비">
    <div class="panel">
      <small>선장의 아쿠아리움</small>
      <h1>제주 감태숲</h1>
      <p>감태숲을 헤엄치며 물고기를 찾아 함께 귀환해요.</p>
      <fieldset class="modes">
        <legend>물방울 조작</legend>
        <div class="mode-options">
          <label class="mode-option"><input type="radio" name="aim-mode" value="assist" checked><span>이름으로 조준</span></label>
          <label class="mode-option"><input type="radio" name="aim-mode" value="direct"><span>직접 조준</span></label>
        </div>
        <p id="mode-help" class="mode-help">물고기 이름을 누르고, 가까이에서 물방울 버튼을 눌러요.</p>
      </fieldset>
      <div class="actions">
        <button id="start" class="primary" type="button" disabled>바다를 준비하고 있어요…</button>
        <button id="intro-dex" class="secondary" type="button" disabled>도감 보기</button>
      </div>
      <a href="./jeju-sea-attribution.md" class="credit">기존 모델·제작 출처</a>
    </div>
  </section>
  <section id="result" class="overlay" aria-label="귀환 결과" hidden>
    <div class="panel">
      <small id="result-mode">탐사 마침</small>
      <h2 id="result-title"></h2>
      <p id="result-note"></p>
      <div class="actions">
        <button id="result-dex" class="primary" type="button">도감 보기</button>
        <button id="restart" class="secondary" type="button">다시 잠수하기</button>
        <button id="change-mode" class="secondary" type="button">조작 바꾸기</button>
      </div>
    </div>
  </section>
  <section id="dex" class="overlay" aria-label="바다 도감" hidden>
    <div class="panel">
      <small>바다 도감</small>
      <div id="collection">
        <h2 id="dex-title"></h2>
        <div id="cards"></div>
        <button id="close-dex" class="secondary" type="button">돌아가기</button>
      </div>
      <div id="detail" hidden>
        <h2 id="detail-title"></h2>
        <img id="detail-image" alt="">
        <p id="detail-note"></p>
        <button id="back-to-cards" class="secondary" type="button">모은 카드로</button>
      </div>
    </div>
  </section>
</main>
<script type="module" src="./jeju-quick-dive.mjs?v=3"></script>
</body>
</html>
