<header><h1>자리돔의 지느러미 결 비교</h1><p>눈·몸색이 같은 두 안에서 지느러미를 비교하세요. 드래그하면 돌려 볼 수 있습니다.</p><nav><button data-v="source">RedSnapper 원형</button><button data-v="previous">이전 시안</button><button data-v="proposed">무채색 수정안</button><button data-v="colour">기존 눈·색 적용안</button><button data-v="fins" aria-pressed="true">지느러미 결 적용안</button><button id="motion" aria-pressed="false">유영 멈춤</button><button id="side">옆모습</button><button id="front">앞모습</button><button id="angle">비스듬한 모습</button></nav><p id="status" role="status">모델을 불러오는 중…</p></header><canvas id="view"></canvas><header><p>눈 크기와 몸의 형태는 같습니다. 흰자·동공·작은 반사광, 회갈색 몸과 밝은 배, 가슴지느러미 부근의 어두운 무늬를 더했습니다. 무채색 수정안과 전환해 비교하세요.</p></header><script type="module" src="./snapper-clay-study.mjs?v=2026-11-03-fin-1"></script></html>
