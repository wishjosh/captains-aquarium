<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>범돔 수조 · 가까이 보기</title><link rel="icon" href="data:,"><link rel="stylesheet" href="fish-view.css"></head>
<body><main><header><a id="back-game" href="index.html" hidden>← 수족관으로</a><span class="badge">제주의 바다 친구 · 3D 시안</span><h1 id="species-name">범돔</h1><p>노란 몸을 따라 검은 줄무늬가 길게 이어져요.</p></header>
<section class="tank" aria-label="범돔을 가까이 관찰하는 수조"><canvas id="fish-canvas" aria-label="헤엄치는 범돔. 화면을 끌면 다른 방향에서 볼 수 있어요."></canvas><p id="loading" role="status">범돔을 만나고 있어요…</p><p id="fish-error" role="alert" hidden>수조를 열지 못했어요. <button id="retry">다시 열기</button></p><span class="hint">수조를 끌어 돌려 보세요</span></section>
<footer><div class="buttons"><button id="pause" aria-pressed="false">Ⅱ 멈추기</button><button id="zoom" aria-pressed="false">＋ 가까이</button></div><label class="speed">헤엄치는 속도 <input id="speed" type="range" min=".5" max="1.5" step=".25" value="1"><output id="speed-value">1배</output></label><p class="study-note">생물의 모습은 다듬는 중이에요.</p></footer></main><script type="module" src="fish-view.js"></script></body></html>
